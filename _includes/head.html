<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  <style>
    .post-content img { display: block; max-width: 100%; margin: 1.5rem auto 0.4rem; }
    .post-content .caption { text-align: center; font-size: 0.9rem; color: #6b6a66; margin-bottom: 1.6rem; }
    .post-content mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }
  </style>
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
